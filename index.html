<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link 
    href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" 
    rel="stylesheet">

    <link rel="stylesheet" href="./src/style.css">

    <title>The Cat App</title>
  </head>
  <body>
    <div id="container">
      <section class="entry-forms-section">
        <h2>The Cats App</h2>
        <div class="forms-holder">
          <form action="" class="cat-facts-form">
            <label for="catFactsInput">number of cat facts (50 maximum)</label>
            <div>
              <input type="number" name="" id="catFactsInput" placeholder="number of cats (50 max)">
              <button type="submit" id="factSubmitBtn">
                submit
              </button>
            </div>
          </form>
          <form action="" class="cat-photos-form">
            <label for="catPhotosInput">number of cats photos (10 max)</label>
           <div>
              <input type="number" name="" id="catPhotosInput" placeholder="number of cat photos (10 max)">
              <button type="submit" id="photoSubmitBtn">
                submit
              </button>
           </div>
          </form>
        </div>
      </section>
      
        <div class="spinner none">
        </div>

      <section class="results-holder">
        <div class="photo-facts-container">
        </div>
      </section>
    </div>
    <script type="module" src="/src/index.mjs"></script>
  </body>
</html>
